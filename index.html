<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>彝境 · YI CULTURAL HERITAGE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC","STSong",serif}
  html,body,div,section{scrollbar-width:none!important;-ms-overflow-style:none!important}
  ::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}

  .progress{position:fixed;top:0;left:0;height:2px;width:0%;
    background:linear-gradient(90deg,#e8c87a,#f6e3a7,#e8c87a);
    box-shadow:0 0 12px rgba(232,200,122,.5);z-index:999;
    transition:width .5s cubic-bezier(.16,1,.3,1)}
  .progress::after{content:"";position:absolute;right:-6px;top:-2px;width:6px;height:6px;border-radius:50%;
    background:#e8c87a;box-shadow:0 0 10px rgba(232,200,122,.9)}

  .dots{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);
    z-index:999;display:flex;gap:8px;padding:6px 14px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:20px;border:1px solid rgba(232,200,122,.18);opacity:0;transition:opacity .5s}
  .dots.show{opacity:1}
  .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .4s cubic-bezier(.16,1,.3,1)}
  .dot.active{width:18px;border-radius:3px;background:linear-gradient(90deg,#e8c87a,#f6e3a7);box-shadow:0 0 8px rgba(232,200,122,.6)}

  .slider{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;
    scroll-behavior:auto;-webkit-overflow-scrolling:touch}
  .slide{position:relative;height:100vh;scroll-snap-align:start;overflow:hidden;background:#0a0a0a}

  /* ========== 只有切片！没有底层图！切片拼出完整画面 ========== */
  .piece{position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center;
    opacity:0;pointer-events:none;
    transition:opacity .7s ease,transform .95s cubic-bezier(.22,1.2,.36,1)}
  .slide.active .piece{opacity:1;transition:opacity .6s ease,transform .95s cubic-bezier(.22,1.2,.36,1)}

  /* ---------- 封面切片 ---------- */
  /* p1: 顶部 0~14%（中国·彝族、01/09） */
  .cover .p1{clip-path:inset(0 0 86% 0);transform:translateY(-30px)}
  /* p2: 大字区 14~46% 高，10~62% 宽（彝境 + YI CULTURAL HERITAGE） */
  .cover .p2{clip-path:polygon(10% 14%,62% 14%,62% 46%,10% 46%);transform:translateY(50px) scale(.9);transition-delay:.18s}
  /* p3: 描述 46~66% 高，10~56% 宽（让千年的火） */
  .cover .p3{clip-path:polygon(10% 48%,56% 48%,56% 64%,10% 64%);transform:translateY(30px);transition-delay:.42s}
  /* p4: 底部 82~100%（彝族非遗 + SCROLL） */
  .cover .p4{clip-path:inset(82% 0 0 0);transform:translateY(20px);transition-delay:.66s}
  .cover.active .p1,.cover.active .p2,.cover.active .p3,.cover.active .p4{transform:none}

  /* ---------- 内页切片（左标题 + 右描述 独立进场） ---------- */
  /* p1: 顶部栏 0~14% */
  .inner .p1{clip-path:inset(0 0 86% 0);transform:translateY(-22px);transition-delay:.08s}
  /* p2: 左标题区（红圈！）：8~46% 宽 × 10~44% 高 */
  .inner .p2{clip-path:polygon(8% 10%,46% 10%,46% 44%,8% 44%);transform:translateX(-60px);transition-delay:.18s}
  /* p3: 右描述区（红圈！）：46~96% 宽 × 20~62% 高 */
  .inner .p3{clip-path:polygon(46% 20%,96% 20%,96% 62%,46% 62%);transform:translateX(60px);transition-delay:.38s}
  /* p4: 底部 84~100% */
  .inner .p4{clip-path:inset(84% 0 0 0);transform:translateY(22px);transition-delay:.56s}
  .inner.active .p1,.inner.active .p2,.inner.active .p3,.inner.active .p4{transform:none}

  /* ---------- 结尾切片 ---------- */
  .ending .p1{clip-path:polygon(26% 18%,74% 18%,74% 50%,26% 50%);transform:scale(.8) translateY(30px);transition-delay:.15s}
  .ending .p2{clip-path:inset(72% 0 0 0);transform:translateY(22px);transition-delay:.42s}
  .ending.active .p1,.ending.active .p2{transform:none}

  /* Ken Burns 微缩放（所有切片一起） */
  .slide.active{animation:kenburns 6s ease-out forwards}
  @keyframes kenburns{0%{background-size:106% 106%}100%{background-size:100% 100%}}

  .swipe-hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:70px;height:70px;border-radius:50%;
    border:2px solid rgba(232,200,122,.6);background:rgba(0,0,0,.45);
    backdrop-filter:blur(8px);z-index:998;pointer-events:none;
    opacity:0;display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#e8c87a;transition:opacity .2s}
  .swipe-hint.show{opacity:1}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div class="dots" id="dots"></div>
<div class="swipe-hint" id="swipeHint"></div>

<div class="slider" id="slider">

  <!-- ============ Slide 1: 封面 ============ -->
  <section class="slide cover active" data-index="0"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/01-yijing.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 2: 远古回响 ============ -->
  <section class="slide inner" data-index="1"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/02-huixiang.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 3: 火之图腾 ============ -->
  <section class="slide inner" data-index="2"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/03-huotuteng.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 4: 指尖生花 ============ -->
  <section class="slide inner" data-index="3"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/04-zhijian.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 5: 黑与红 ============ -->
  <section class="slide inner" data-index="4"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/05-heiuhong.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 6: 漆韵千年 ============ -->
  <section class="slide inner" data-index="5"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/06-qiyun.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 7: 银饰之美 ============ -->
  <section class="slide inner" data-index="6"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/07-yinshi.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 8: 新生传承 ============ -->
  <section class="slide inner" data-index="7"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/08-xinsheng.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
    <div class="piece p3"></div>
    <div class="piece p4"></div>
  </section>

  <!-- ============ Slide 9: 生生不息 ============ -->
  <section class="slide ending" data-index="8"
    style="--img:url('https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/09-shengsheng.png')">
    <div class="piece p1"></div>
    <div class="piece p2"></div>
  </section>

</div>

<script>
(function(){
  var slider=document.getElementById('slider'),slides=document.querySelectorAll('.slide');
  var progress=document.getElementById('progress'),dotsWrap=document.getElementById('dots'),hint=document.getElementById('swipeHint');
  var total=slides.length,currentIdx=0;

  for(var i=0;i<total;i++){var d=document.createElement('div');d.className='dot'+(i===0?' active':'');dotsWrap.appendChild(d);}
  var dots=dotsWrap.querySelectorAll('.dot');

  function updateUI(idx){progress.style.width=((idx+1)/total*100)+'%';for(var j=0;j<dots.length;j++) dots[j].classList.toggle('active',j===idx);}
  function showHint(arrow){hint.textContent=arrow;hint.classList.add('show');setTimeout(function(){hint.classList.remove('show')},300);}

  function goTo(idx){
    if(idx<0||idx>=total||idx===currentIdx) return;
    slides[currentIdx].classList.remove('active');
    slides[idx].classList.add('active');
    try{if('vibrate' in navigator) navigator.vibrate(15);}catch(e){}
    showHint(idx<currentIdx?'↑':'↓');currentIdx=idx;updateUI(idx);
  }

  slides[0].classList.add('active');
  updateUI(0);dotsWrap.classList.add('show');setTimeout(function(){dotsWrap.classList.remove('show')},2000);

  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){var idx=parseInt(e.target.dataset.index,10);if(idx!==currentIdx) goTo(idx);}});
  },{root:slider,threshold:0.5});
  slides.forEach(function(s){io.observe(s);});

  var startY=0,startT=0;
  slider.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;startT=Date.now();},{passive:true});
  slider.addEventListener('touchend',function(e){
    var dy=startY-(e.changedTouches[0].clientY),dt=Date.now()-startT;
    var fast=dt<500&&Math.abs(dy)>40,long=Math.abs(dy)>window.innerHeight*0.25;
    if(fast||long){var t=currentIdx+(dy>0?1:-1);if(t>=0&&t<total) slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});}
  },{passive:true});

  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='PageDown'){var t=currentIdx+1;if(t<total)slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});}
    else if(e.key==='ArrowUp'||e.key==='PageUp'){var t=currentIdx-1;if(t>=0)slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});}
  });

  var wheelLock=false;
  slider.addEventListener('wheel',function(e){
    e.preventDefault();if(wheelLock)return;wheelLock=true;setTimeout(function(){wheelLock=false},500);
    var t=currentIdx+(e.deltaY>0?1:-1);if(t>=0&&t<total) slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});
  },{passive:false});
})();
</script>
</body>
</html>
