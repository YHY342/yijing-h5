<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="description" content="彝境 · 千年彝族文化遗产 H5 展示">
<title>彝境 · YI CULTURAL HERITAGE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff}
  html,body,div,section{scrollbar-width:none!important;-ms-overflow-style:none!important}
  ::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}

  /* ========== 顶部进度条 ========== */
  .progress{
    position:fixed;top:0;left:0;height:2px;width:0%;
    background:linear-gradient(90deg,#e8c87a,#f6e3a7,#e8c87a);
    box-shadow:0 0 12px rgba(232,200,122,.5);
    z-index:999;transition:width .45s cubic-bezier(.16,1,.3,1);
  }
  .progress::after{
    content:"";position:absolute;right:-6px;top:-2px;width:6px;height:6px;border-radius:50%;
    background:#e8c87a;box-shadow:0 0 10px rgba(232,200,122,.9);
  }

  /* ========== 底部页码圆点（不挡主文字） ========== */
  .dots{
    position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);
    left:50%;transform:translateX(-50%);
    z-index:999;display:flex;gap:8px;padding:6px 14px;
    background:rgba(0,0,0,.28);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:20px;border:1px solid rgba(232,200,122,.18);
    opacity:0;transition:opacity .4s ease;
  }
  .dots.show{opacity:1}
  .dot{
    width:4px;height:4px;border-radius:50%;
    background:rgba(255,255,255,.3);
    transition:all .4s cubic-bezier(.16,1,.3,1);
  }
  .dot.active{
    width:18px;border-radius:3px;
    background:linear-gradient(90deg,#e8c87a,#f6e3a7);
    box-shadow:0 0 8px rgba(232,200,122,.6);
  }

  /* ========== 滑动容器 ========== */
  .slider{
    height:100vh;overflow-y:auto;overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:auto;
    -webkit-overflow-scrolling:touch;
  }

  /* ========== 每一页 ========== */
  .slide{
    position:relative;height:100vh;
    scroll-snap-align:start;overflow:hidden;
  }
  .slide img{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;user-select:none;
    /* Ken Burns 呼吸缩放：active 页缓慢放大 */
    transform:scale(1);
    transition:transform 2.2s cubic-bezier(.16,1,.3,1),
                filter .6s ease;
    filter:brightness(1.02);
  }
  .slide.active img{transform:scale(1.04)}
  .slide.prev img{transform:scale(1.02);filter:brightness(.95)}

  /* ========== 翻页 swipe 指示器 ========== */
  .swipe-hint{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:80px;height:80px;border-radius:50%;
    border:2px solid rgba(232,200,122,.6);
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:998;pointer-events:none;
    opacity:0;transition:opacity .2s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;color:#e8c87a;
  }
  .swipe-hint.show{opacity:1}
</style>
</head>
<body>

<!-- 顶部进度条 -->
<div class="progress" id="progress"></div>
<!-- 底部页码 -->
<div class="dots" id="dots"></div>
<!-- 翻页提示 -->
<div class="swipe-hint" id="swipeHint"></div>

<div class="slider" id="slider">
  <!-- 1 彝境 · 封面 -->
  <section class="slide active" data-index="0">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/01-yijing.png" alt="彝境">
  </section>
  <!-- 2 远古回响 -->
  <section class="slide" data-index="1">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/02-huixiang.png" alt="远古回响">
  </section>
  <!-- 3 火之图腾 -->
  <section class="slide" data-index="2">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/03-huotuteng.png" alt="火之图腾">
  </section>
  <!-- 4 指尖生花 -->
  <section class="slide" data-index="3">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/04-zhijian.png" alt="指尖生花">
  </section>
  <!-- 5 黑与红 -->
  <section class="slide" data-index="4">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/05-heiuhong.png" alt="黑与红">
  </section>
  <!-- 6 漆韵千年 -->
  <section class="slide" data-index="5">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/06-qiyun.png" alt="漆韵千年">
  </section>
  <!-- 7 银饰之美 -->
  <section class="slide" data-index="6">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/07-yinshi.png" alt="银饰之美">
  </section>
  <!-- 8 新生传承 -->
  <section class="slide" data-index="7">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/08-xinsheng.png" alt="新生传承">
  </section>
  <!-- 9 生生不息 -->
  <section class="slide" data-index="8">
    <img src="https://cdn.jsdelivr.net/gh/YHY342/yijing-h5@gh-pages/images/09-shengsheng.png" alt="生生不息">
  </section>
</div>

<script>
(function(){
  var slider = document.getElementById('slider');
  var slides = document.querySelectorAll('.slide');
  var progress = document.getElementById('progress');
  var dotsWrap = document.getElementById('dots');
  var hint = document.getElementById('swipeHint');
  var total = slides.length;
  var currentIdx = 0;

  // ========== 构建底部圆点 ==========
  for(var i=0;i<total;i++){
    var d = document.createElement('div');
    d.className = 'dot' + (i===0?' active':'');
    dotsWrap.appendChild(d);
  }
  var dots = dotsWrap.querySelectorAll('.dot');

  // ========== 更新进度条 + 圆点 ==========
  function updateUI(idx){
    progress.style.width = ((idx+1)/total*100) + '%';
    for(var j=0;j<dots.length;j++) dots[j].classList.toggle('active', j===idx);
  }

  // ========== 翻页状态管理 ==========
  function goTo(idx){
    if(idx<0||idx>=total||idx===currentIdx) return;
    // 更新 active class（Ken Burns 动画触发）
    slides[currentIdx].classList.remove('active');
    slides[currentIdx].classList.add('prev');
    slides[idx].classList.add('active');
    // 震动反馈
    try { if('vibrate' in navigator) navigator.vibrate(15); } catch(e){}
    // 翻页提示
    showHint(idx<currentIdx?'↑':'↓');
    currentIdx = idx;
    updateUI(idx);
    // 隐藏上一页的 prev
    setTimeout(function(){
      slides.forEach(function(s){ if(!s.classList.contains('active')) s.classList.remove('prev'); });
    }, 600);
  }

  function showHint(arrow){
    hint.textContent = arrow;
    hint.classList.add('show');
    setTimeout(function(){ hint.classList.remove('show'); }, 350);
  }

  // 初始进度
  updateUI(0);
  dotsWrap.classList.add('show');
  setTimeout(function(){ dotsWrap.classList.remove('show'); }, 2000);

  // ========== IntersectionObserver 翻页检测 ==========
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var idx = parseInt(e.target.dataset.index,10);
        if(idx!==currentIdx){
          goTo(idx);
        }
      }
    });
  },{ root:slider, threshold:0.5 });
  slides.forEach(function(s){ io.observe(s); });

  // ========== 触摸快速翻页 ==========
  var startY=0, startT=0;
  slider.addEventListener('touchstart',function(e){
    startY = e.touches[0].clientY;
    startT = Date.now();
  },{passive:true});
  slider.addEventListener('touchend',function(e){
    var dy = startY - (e.changedTouches[0].clientY);
    var dt = Date.now() - startT;
    var fast = dt < 500 && Math.abs(dy) > 40;
    var long = Math.abs(dy) > window.innerHeight*0.25;
    if(fast || long){
      var target = currentIdx + (dy>0?1:-1);
      if(target>=0&&target<total){
        slider.scrollTo({top:target*window.innerHeight,behavior:'smooth'});
      }
    }
  },{passive:true});

  // ========== 键盘（PC 预览） ==========
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='PageDown'){
      var t = currentIdx+1; if(t<total) slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});
    } else if(e.key==='ArrowUp'||e.key==='PageUp'){
      var t = currentIdx-1; if(t>=0) slider.scrollTo({top:t*window.innerHeight,behavior:'smooth'});
    } else if(e.key==='Home'){
      slider.scrollTo({top:0,behavior:'smooth'});
    } else if(e.key==='End'){
      slider.scrollTo({top:(total-1)*window.innerHeight,behavior:'smooth'});
    }
  });

  // ========== 双击封面震动 ==========
  var lastTap=0;
  slider.addEventListener('touchend',function(){
    var now = Date.now();
    if(now - lastTap < 300){
      try { if('vibrate' in navigator) navigator.vibrate([10,30,10]); } catch(e){}
    }
    lastTap = now;
  },{passive:true});

  // ========== 鼠标滚轮平滑（PC） ==========
  var wheelLock=false;
  slider.addEventListener('wheel',function(e){
    e.preventDefault();
    if(wheelLock) return;
    wheelLock=true;
    setTimeout(function(){ wheelLock=false; }, 600);
    var target = currentIdx + (e.deltaY>0?1:-1);
    if(target>=0&&target<total){
      slider.scrollTo({top:target*window.innerHeight,behavior:'smooth'});
    }
  },{passive:false});
})();
</script>
</body>
</html>
